name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:pack

  # The lab's conformance bars (CONTRACT.md) on software WebGPU: three's velocity,
  # the oracle and motion from depth must agree where three is exact. Real-GPU
  # numbers (docs/MOTION.md) come from local runs.
  conformance:
    name: conformance (SwiftShader, ${{ matrix.experiments }}${{ matrix.three && format(', three {0}', matrix.three) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Shards in parallel: the oracle's full camera track alone is ~11 min on SwiftShader.
    # `cuts` checks the GPU cut detector against the audit and the cut timeline's truth.
    # `rigs` holds skinning, instancing, batching (R3), the author hook (R7) and
    # displacementMap (R9); `upstream` checks the node's table of what three
    # handles per release (R12). The last shard repeats the node's bars on the
    # oldest supported three (the peer range's floor).
    strategy:
      fail-fast: false
      matrix:
        include:
          - experiments: oracle
          - experiments: 'cases,jitter,node'
          - experiments: cuts
          - experiments: 'rigs,upstream'
          - experiments: 'rigs,upstream,cases,node'
            three: 0.186.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use three ${{ matrix.three }}
        if: matrix.three
        run: npm install --no-save three@${{ matrix.three }}
      # Chrome for Testing (current stable), as the downsampler's SwiftShader CI uses,
      # so runs don't drift with the runner image's preinstalled Chrome.
      - name: Install Chrome for Testing
        run: |
          path=$(npx -y @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/cft" --format '{{path}}')
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          "$path" --version
      - name: Lab conformance check
        run: node scripts/measure-motion.mjs --check --experiments ${{ matrix.experiments }} --adapter swiftshader --width 640 --height 360 --label ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-${{ strategy.job-index }}
          path: results/ci
          if-no-files-found: warn
          retention-days: 14

  # The pixi-3d adapter against analytic motion (scripts/check-pixi.mjs), on its
  # own so it reports in minutes, not after the lab shards.
  pixi:
    name: pixi-3d check (SwiftShader)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chrome for Testing
        run: |
          path=$(npx -y @puppeteer/browsers@2 install chrome@stable --path "$RUNNER_TEMP/cft" --format '{{path}}')
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          "$path" --version
      - name: pixi-3d check
        run: node scripts/check-pixi.mjs --adapter swiftshader --width 640 --height 360
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixi-check
          path: results/pixi
          if-no-files-found: warn
          retention-days: 14
