name: Release

# Publishes @pmndrs/motion-vectors to npm with provenance. Manual only
# (Actions → Release → Run workflow): no push, pull request, tag or schedule
# trigger. Before running it, the real-GPU lab must pass on the commit
# (`npm run check:gpu`, `npm run check:pixi`, CLAUDE.md); CI's SwiftShader
# shards are not a substitute for that.
#
# Setup, once (docs/PLAN.md gate P):
# - The repository must be public: npm refuses provenance from a private one.
# - npm access: trusted publishing for @pmndrs/motion-vectors (npmjs.com →
#   package settings → Trusted publisher: GitHub Actions, organization pmndrs,
#   repository motion-vectors, workflow release.yml, environment npm), which
#   needs no token. npm only offers that once the package exists, so the first
#   publish needs an npm token with publish rights to the @pmndrs scope in the
#   `npm` environment's NPM_TOKEN secret (remove it after switching to trusted
#   publishing). Optionally, required reviewers on the `npm` environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish. Must equal package.json's (guards against publishing the wrong commit).
        required: true
        type: string
      dist-tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry-run:
        description: Run everything, but `npm publish --dry-run`
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  # npm provenance: the OIDC token that signs the package's build attestation.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish ${{ inputs.version }} (${{ inputs.dist-tag }}${{ inputs.dry-run && ', dry run' || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          actual=$(node -p "require('./package.json').version")
          if [ "$actual" != "$VERSION" ]; then echo "::error::package.json has version $actual, not $VERSION"; exit 1; fi
          private=$(node -p "require('./package.json').private === true")
          if [ "$private" = true ]; then echo "::error::package.json is still private"; exit 1; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Packs the tarball and checks every subpath resolves from it (what a consumer installs).
      - run: npm run verify:pack
      - name: List the package contents
        run: npm pack --dry-run
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ inputs.dist-tag }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          flags="--provenance --access public --tag $DIST_TAG"
          if [ "$DRY_RUN" = true ]; then flags="$flags --dry-run"; fi
          npm publish $flags
