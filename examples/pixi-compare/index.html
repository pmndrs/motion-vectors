<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>pixi-3d velocity vs MotionVectors</title>
        <link rel="icon" href="data:," />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #000;
                font-family: system-ui, sans-serif;
                color: #e8ecf2;
            }
            canvas {
                display: block;
            }
            .label {
                position: fixed;
                top: 12px;
                padding: 4px 10px;
                border-radius: 4px;
                background: rgb(0 0 0 / 0.55);
                font-size: 14px;
                pointer-events: none;
            }
            #left {
                left: 12px;
            }
            #right {
                right: 12px;
            }
            #controls {
                position: fixed;
                bottom: 12px;
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
                padding: 6px;
                border-radius: 6px;
                background: rgb(0 0 0 / 0.55);
            }
            #controls button {
                font: inherit;
                font-size: 13px;
                padding: 6px 12px;
                border: 1px solid #556;
                border-radius: 4px;
                background: #22262e;
                color: inherit;
                cursor: pointer;
            }
            #controls button[aria-pressed='true'] {
                background: #3a6ea8;
                border-color: #6aa0dc;
            }
            #divider {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 50%;
                width: 2px;
                margin-left: -1px;
                background: rgb(255 255 255 / 0.6);
                pointer-events: none;
            }
            #error {
                position: fixed;
                inset: 0;
                display: none;
                place-items: center;
                padding: 16px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div id="divider"></div>
        <div class="label" id="left">pixi-3d <code>velocityOutput</code></div>
        <div class="label" id="right"><code>MotionVectors</code></div>
        <div id="controls">
            <button data-view="motion" aria-pressed="true">Motion vectors</button>
            <button data-view="scene" aria-pressed="false">Scene</button>
            <button id="pause" aria-pressed="false">Pause</button>
        </div>
        <div id="error"></div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
